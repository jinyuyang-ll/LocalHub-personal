name: Integration E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '30 18 * * *'

jobs:
  compose-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_ROOT_PASSWORD: localhub_e2e_only
      LOCALHUB_AI_ENABLED: 'false'
      LOCALHUB_CANAL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start complete stack and wait for health checks
        run: docker compose up --build --detach --wait
      - name: Install Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color --tail=500
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
